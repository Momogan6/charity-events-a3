<header class="site-header">
  <div class="container">
    <a class="brand" routerLink="/dashboard">
      <span class="brand-mark" aria-hidden="true">&#9881;</span>
      <span>Charity Events <span class="brand-sub">Admin</span></span>
    </a>

    <nav class="nav-links" aria-label="Administration navigation">
      @for (link of links; track link.path) {
        <a
          [routerLink]="link.path"
          routerLinkActive="active">{{ link.label }}</a>
      }
    </nav>
  </div>
</header>

<div class="console-bar">
  <div class="container">
    <strong>Staff console</strong>
    <span>&middot;</span>
    <span>Full C.R.U.D. control over charity events and registrations</span>
    <span class="spacer"></span>
    <a routerLink="/dashboard">&#8635; Refresh dashboard</a>
  </div>
</div>
